name: notette_flutter
description: A feedback overlay for Flutter apps using a self-hosted Notette server, with optional screenshots and reviewer sign-in.
version: 0.1.0
repository: https://github.com/blunderworks/notette/tree/main/packages/notette_flutter
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cloudflare_turnstile: ^3.8.1
  shared_preferences: ^2.3.2
  flutter_secure_storage: '>=9.2.4 <12.0.0'
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
